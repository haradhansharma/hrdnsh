{% load common %}

<form id="comment_edit_form" hx-post="{{comment.get_delete_edit_url}}" hx-target="#comment{{comment.id}}" hx-swap="innerHTML" hx-vals='{"comment_edit_form": "comment_edit_form"}'>
    {% csrf_token %}
    <div class="d-flex flex-column">
        {{comment_edit_form.body}}
    </div>
    <div style="text-align: right;">
        <div class="d-flex justify-content-between align-items-center mt-2">          
            <button class="btn btn-primary rounded-5" type="submit">Submit</button>
        </div>
    </div>
</form><!-- End: reply_form -->
