{% load common %}

<h6 class="fw-bold mb-1">{{comment.email|build_commenter|upper}}</h6>
<div class="d-flex justify-content-between align-items-center">
    <p class="mb-0 lh-sm fs-6 fw-light text-muted"> {{comment.created_at|date}} </p>
    <ul class="list-inline mb-0 d-flex">
        <li class="list-inline-item">
            <a class="link-success m-0 lh-sm fs-4 fw-normal d-flex" hx-get="{{comment.get_delete_edit_url}}"  hx-target="#comment{{comment.id}}" hx-swap="innerHTML">
                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="currentColor" viewBox="0 0 16 16" class="bi bi-pencil-square">
                    <path d="M15.502 1.94a.5.5 0 0 1 0 .706L14.459 3.69l-2-2L13.502.646a.5.5 0 0 1 .707 0l1.293 1.293zm-1.75 2.456-2-2L4.939 9.21a.5.5 0 0 0-.121.196l-.805 2.414a.25.25 0 0 0 .316.316l2.414-.805a.5.5 0 0 0 .196-.12l6.813-6.814z"></path>
                    <path fill-rule="evenodd" d="M1 13.5A1.5 1.5 0 0 0 2.5 15h11a1.5 1.5 0 0 0 1.5-1.5v-6a.5.5 0 0 0-1 0v6a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5v-11a.5.5 0 0 1 .5-.5H9a.5.5 0 0 0 0-1H2.5A1.5 1.5 0 0 0 1 2.5v11z"></path>
                </svg>
            </a>
        </li>
        <li class="list-inline-item">
            <a class="link-muted m-0 lh-sm fs-4 fw-normal d-flex" hx-delete="{{comment.get_delete_edit_url}}"  hx-target="#comment{{comment.id}}" hx-confirm="Are you sure you wish to delete your account?" hx-swap="innerHTML">
                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="currentColor" viewBox="0 0 16 16" class="bi bi-trash text-danger">
                    <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5Zm2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5Zm3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6Z"></path>
                    <path d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1ZM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118ZM2.5 3h11V2h-11v1Z"></path>
                </svg>
            </a>
        </li>
    </ul>
</div>
<p class="mb-0 lh-sm fs-6 fw-normal text-justify"> 
    {{ comment.body }} 
</p>
{% if err %}
<small class="text-danger fs-6">{{ err|safe }}</small>
{% endif %}
